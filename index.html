<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIGAP DPPKBP3A BAGIAN UMUM</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-blue-900 h-screen flex items-center justify-center">

    <!-- Logo / Header -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 mx-auto mb-4 flex items-center justify-center">
                <img src="logo.png" alt="Logo DPPKBP3A" class="max-h-full object-contain">
            </div>
            <h1 class="text-2xl font-bold tracking-wider">SIGAP BAGIAN UMUM</h1>

        <!-- Form Login -->
        <form action="index.html" method="GET">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2" for="username">NIP / Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="username" required placeholder="Masukkan NIP atau Username" 
                        class="w-full pl-10 pr-4 py-2.5 bg-white/5 border border-white/20 rounded-lg focus:outline-none focus:border-blue-400 text-sm placeholder-gray-400">
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium mb-2" for="password">Kata Sandi</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full pl-10 pr-4 py-2.5 bg-white/5 border border-white/20 rounded-lg focus:outline-none focus:border-blue-400 text-sm placeholder-gray-400">
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 transition duration-300 font-semibold py-2.5 rounded-lg shadow-md text-sm">
                Masuk ke Aplikasi
            </button>
        </form>

        <div class="text-center mt-6 text-xs text-gray-400">
            &copy; 2026 Dinas PPKBP3A. All rights reserved.
        </div>
    </div>

</body>
</html>
