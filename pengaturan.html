    <!-- SCRIPT JAVASCRIPT UNTUK PREVIEW FOTO -->
    <script>
        function tampilkanPreviewFoto(input) {
            const file = input.files[0];
            
            if (file) {
                // Validasi ukuran berkas (Maksimal 2MB = 2 * 1024 * 1024 bytes)
                if (file.size > 2 * 1024 * 1024) {
                    alert('Ukuran foto terlalu besar! Maksimal 2MB.');
                    input.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('previewFoto');
                    const textAvatar = document.getElementById('textAvatar');
                    
                    // Set src gambar dengan data gambar yang baru diunggah
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    textAvatar.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function simpanProfil(e) {
            e.preventDefault();
            alert('Perubahan profil berhasil disimpan!');
        }
    </script>
